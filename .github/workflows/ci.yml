name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq jq shellcheck
          npm install -g @anthropic-ai/claude-code@2.1.319
      - name: Shellcheck
        run: shellcheck scripts/*.sh tests/*.sh
      - name: Test suite
        run: ./tests/test-suite.sh
      - name: Validate plugin
        run: claude plugin validate . --strict
